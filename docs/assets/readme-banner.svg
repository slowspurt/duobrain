<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">duobrain — You work together. Your AI should, too.</title>
  <desc id="desc">Two people. Two AIs. One shared memory. Lime and violet circles meet around a shared note on a charcoal background.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#35404a"/>
    </pattern>
  </defs>
  <rect width="1280" height="440" rx="20" fill="#10151b"/>
  <rect x="824" y="104" width="408" height="264" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="40" width="76" height="43" rx="4" fill="#c8ff3d"/>
    <text x="65" y="71" fill="#10151b" font-size="33" font-weight="700" letter-spacing="-2">duo</text>
    <text x="139" y="71" fill="#f4f7f8" font-size="33" font-weight="700" letter-spacing="-2">brain</text>
    <rect x="1075" y="43" width="149" height="32" rx="16" fill="#222a33"/>
    <circle cx="1092" cy="59" r="4" fill="#b5a2ff"/>
    <text x="1106" y="64" fill="#d1d9e0" font-size="13" letter-spacing="1">LOCAL ALPHA</text>

    <text x="53" y="180" fill="#f4f7f8" font-size="66" font-weight="700" letter-spacing="-2.8">You work together.</text>
    <text x="53" y="257" fill="#c8ff3d" font-size="66" font-weight="700" letter-spacing="-2.8">Your AI should, too.</text>
    <text x="56" y="310" fill="#bac5ce" font-size="24">Two people. Two AIs. One shared memory.</text>

    <g fill="none" stroke-width="2">
      <circle cx="969" cy="215" r="86" stroke="#c8ff3d"/>
      <circle cx="1101" cy="215" r="86" stroke="#a88fff"/>
      <path d="M938 215h194" stroke="#52616d" stroke-dasharray="4 7"/>
    </g>
    <circle cx="914" cy="149" r="8" fill="#c8ff3d"/>
    <circle cx="1156" cy="281" r="8" fill="#a88fff"/>
    <rect x="1000" y="169" width="70" height="92" rx="10" fill="#202b34" stroke="#8d9da9"/>
    <path d="M1017 193h24M1017 209h36M1017 225h36M1017 241h20" fill="none" stroke-width="3" stroke-linecap="round" stroke="#c8ff3d"/>
    <path d="M1017 225h36M1017 241h20" fill="none" stroke-width="3" stroke-linecap="round" stroke="#b5a2ff"/>
    <text x="1035" y="339" fill="#aebbc6" font-size="13" letter-spacing="2" text-anchor="middle">KEEP THE CONTEXT.</text>

    <path d="M56 366h1168" stroke="#303c46"/>
    <text x="56" y="404" fill="#d5dee5" font-size="14" letter-spacing="1.5">LESS REPEATING. MORE BUILDING.</text>
    <text x="1224" y="404" fill="#aebbc6" font-size="14" letter-spacing="1.5" text-anchor="end">BUILT FOR TWO</text>
  </g>
</svg>
