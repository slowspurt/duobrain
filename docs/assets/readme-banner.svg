<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">duobrain — You work together. Your AI should, too.</title>
  <desc id="desc">Two people. Two AIs. One shared memory. A charcoal and lime duobrain wordmark and headline.</desc>
  <rect width="1280" height="480" rx="24" fill="#11191e"/>
  <g fill="none" stroke="#27343a" stroke-width="1">
    <circle cx="1165" cy="230" r="230"/>
    <circle cx="1165" cy="230" r="172"/>
    <circle cx="1165" cy="230" r="114"/>
    <path d="M934 230h346M1165 0v460"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="48" width="79" height="44" rx="5" fill="#d4fa6c"/>
    <text x="73" y="80" fill="#11191e" font-size="34" font-weight="700" letter-spacing="-2">duo</text>
    <text x="148" y="80" fill="#f4f7f8" font-size="34" font-weight="700" letter-spacing="-2">brain</text>
    <text x="1216" y="77" fill="#a9b9c0" font-size="13" letter-spacing="3" text-anchor="end">BUILT FOR TWO</text>
    <text x="60" y="199" fill="#f4f7f8" font-size="70" font-weight="700" letter-spacing="-3">You work together.</text>
    <text x="60" y="280" fill="#d4fa6c" font-size="70" font-weight="700" letter-spacing="-3">Your AI should, too.</text>
    <text x="64" y="337" fill="#b8c5cb" font-size="24">Two people. Two AIs. One shared memory.</text>
    <path d="M64 380h1152" stroke="#344249"/>
    <text x="64" y="423" fill="#dce4e8" font-size="15" letter-spacing="1">LESS REPEATING. MORE BUILDING.</text>
    <circle cx="1048" cy="417" r="17" fill="#d4fa6c"/>
    <circle cx="1075" cy="417" r="17" fill="#b5a2ff"/>
    <text x="1110" y="423" fill="#a9b9c0" font-size="14">local alpha</text>
  </g>
</svg>
