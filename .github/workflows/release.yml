name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate tag input
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run release:check
      - run: npm test
      - run: npm run test:scenarios
      - name: Build source archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="duobrain-$RELEASE_TAG/" --output="dist/duobrain-$RELEASE_TAG.tar.gz" HEAD
          git archive --format=zip --prefix="duobrain-$RELEASE_TAG/" --output="dist/duobrain-$RELEASE_TAG.zip" HEAD
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Create or update draft
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!require("./release-state.json").isDraft) throw new Error("Release is already published; refusing to overwrite it.")'
            gh release edit "$RELEASE_TAG" --title "duobrain $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "duobrain $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
